[mod-setting-description]
apia-carnova-addon-hive-module-slots=Number of module slots on the artificial hive. 0 keeps the vanilla behavior (no modules). Changing this requires a restart.
apia-carnova-addon-hive-effect-speed=Allow the speed effect for the artificial hive. Applies to modules inserted in the machine and to effects received from beacons. Requires a restart.
apia-carnova-addon-hive-effect-productivity=Allow the productivity effect for the artificial hive. Also enables productivity on the hive's honeycomb recipes. Applies to modules inserted in the machine and to effects received from beacons. Requires a restart.
apia-carnova-addon-hive-effect-consumption=Allow the energy usage (consumption) effect for the artificial hive. Applies to modules inserted in the machine and to effects received from beacons. Requires a restart.
apia-carnova-addon-hive-effect-pollution=Allow the pollution effect for the artificial hive. Applies to modules inserted in the machine and to effects received from beacons. Requires a restart.
apia-carnova-addon-hive-effect-quality=Allow the quality effect for the artificial hive. Applies to modules inserted in the machine and to effects received from beacons. Requires a restart.
apia-carnova-addon-biosynthesizer-tile-recipes=Adds Apia's tile recipes (wax platform, artificial honey/copper/iron soil) to the Biosynthesizer. The artificial soil recipes keep their restriction to the Apia surface. Requires a restart.
