[mod-setting-description]
apia-carnova-addon-hive-module-slots=Number of module slots on the artificial hive. 0 keeps the vanilla behavior (no modules). Changing this requires a restart.
apia-carnova-addon-hive-effect-speed=Allow speed modules in the artificial hive. Disallowed modules are removed from placed hives when the setting changes.
apia-carnova-addon-hive-effect-productivity=Allow productivity modules in the artificial hive. Disallowed modules are removed from placed hives when the setting changes.
apia-carnova-addon-hive-effect-consumption=Allow energy usage (consumption) modules in the artificial hive. Disallowed modules are removed from placed hives when the setting changes.
apia-carnova-addon-hive-effect-pollution=Allow pollution modules in the artificial hive. Disallowed modules are removed from placed hives when the setting changes.
apia-carnova-addon-hive-effect-quality=Allow quality modules in the artificial hive. Disallowed modules are removed from placed hives when the setting changes.
